[package]
name = "xhf"
version = "0.0.2"
edition = "2024"
authors = ["Ivan Zakharchanka <3axap4eHko@gmail.com>"]
description = "Fast Hugging Face Hub search and resumable parallel downloads"
license = "MIT"
repository = "https://github.com/3axap4eHko/xhf"
homepage = "https://github.com/3axap4eHko/xhf"
readme = "README.md"
keywords = ["huggingface", "model", "download", "cli", "machine-learning"]
categories = ["command-line-utilities"]

[dependencies]
clap = { version = "=4.6.6", features = ["derive"] }
globset = "=0.4.20"
reqwest = { version = "=0.13.5", features = ["blocking", "json", "query"] }
rpassword = "=7.5.4"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"

[profile.release]
lto = "fat"
codegen-units = 1
opt-level = 3
strip = true
panic = "abort"
